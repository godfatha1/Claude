[package]
name = "poke-engine-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned, and patched for the browser by scripts/build_wasm.sh — see that
# script for why the patches are needed.
poke-engine = { version = "=0.0.48", default-features = false, features = ["gen9"] }
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }

# A clock that works in a browser. std's Instant compiles for wasm and then
# panics when it runs, so this has to be explicit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
